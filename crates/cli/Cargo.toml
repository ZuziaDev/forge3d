[package]
name = "forge3d-cli"
description = "forge3d command line: MCP server (stdio / Streamable HTTP), headless script runner and file conversion"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "forge3d"
path = "src/main.rs"

[features]
default = ["gui"]
# Interactive window (winit + egui + wgpu) with a live MCP server.
gui = ["dep:forge3d-app"]

[dependencies]
forge3d-app = { path = "../app", optional = true }
forge3d-api.workspace = true
forge3d-core.workspace = true
forge3d-io.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
png.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }
