[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
forge3d-core = { path = "crates/core" }
forge3d-io = { path = "crates/io" }
forge3d-api = { path = "crates/api" }
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
schemars = { version = "1", features = ["uuid1"] }
forge3d-render = { path = "crates/render", default-features = false }
# wgpu version matches the one egui-wgpu 0.37 depends on, so the app shares one wgpu.
wgpu = "30"
png = "0.18"
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
